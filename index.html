
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <h1>Tic-Tac-Toe</h1>
        <p class="subtitle">Think smart. Make your move.</p>

        <div class="mode">
            <button id="twoPlayer" class="mode-btn active">
                2 Players
            </button>
            <button id="computer" class="mode-btn">
                Vs Computer
            </button>
        </div>
            
        <div id="difficultySettings">
          <label for="difficulty">Computer difficulty:</label>
           <select id="difficulty">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="impossible">Impossible</option>
             </select>
        </div>

        <div class="scoreboard">
            <div class="score-card">
                <span id="xLabel">Player X</span>
                <strong id="xScore">0</strong>
            </div>
            <div class="score-card">
                <span>Draws</span>
                <strong id="drawScore">0</strong>
            </div>
            <div class="score-card">
                <span id="oLabel">Player O</span>
                <strong id="oScore">0</strong>
            </div>
        </div>

        <p id="status" aria-live="polite">Player X's turn</p>

        <div class="board" id="board">
            <button class="cell" data-index="0" aria-label="Cell 1"></button>
            <button class="cell" data-index="1" aria-label="Cell 2"></button>
            <button class="cell" data-index="2" aria-label="Cell 3"></button>
            <button class="cell" data-index="3" aria-label="Cell 4"></button>
            <button class="cell" data-index="4" aria-label="Cell 5"></button>
            <button class="cell" data-index="5" aria-label="Cell 6"></button>
            <button class="cell" data-index="6" aria-label="Cell 7"></button>
            <button class="cell" data-index="7" aria-label="Cell 8"></button>
            <button class="cell" data-index="8" aria-label="Cell 9"></button>
        </div>

        <div class="actions">
            <button id="restart" class="primary-btn">New Round</button>
            <button id="resetScore" class="secondary-btn">Reset Scores</button>
        </div>

        <p class="hint">First to three in a row wins the round!</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
